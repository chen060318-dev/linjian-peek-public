services:
  - type: web
    name: lr-sense-0714
    runtime: node
    plan: free
    region: singapore
    branch: lr-sense-service
    rootDir: lr-sense
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: MCP_API_TOKEN
        generateValue: true
      - key: SENSOR_API_TOKEN
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
