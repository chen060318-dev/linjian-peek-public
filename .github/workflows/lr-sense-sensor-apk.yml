name: Build LR Sense Sensor APK

on:
  workflow_dispatch:
  push:
    branches:
      - lr-sense-service
    paths:
      - 'lr-sense-android/**'
      - '.github/workflows/lr-sense-sensor-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Build LR Sense Sensor
        run: bash lr-sense-android/build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lr-sense-sensor-apk
          path: lr-sense-android/LR-Sense-Sensor-v0.1.apk
          if-no-files-found: error
